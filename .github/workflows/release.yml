name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like v0.1.0" >&2
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Build Universal app
        shell: bash
        env:
          APP_VERSION: ${{ github.ref_name }}
          BUILD_CONFIGURATION: release
        run: |
          APP_VERSION="${APP_VERSION#v}" ./script/build_and_run.sh build

      - name: Verify and package app
        shell: bash
        run: |
          set -euo pipefail
          app="dist/WhisperForMac.app"
          binary="$app/Contents/MacOS/WhisperForMac"
          codesign --verify --deep --strict --verbose=2 "$app"
          archs="$(lipo -archs "$binary")"
          [[ " $archs " == *' arm64 '* && " $archs " == *' x86_64 '* ]]
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [[ "$version" == "${GITHUB_REF_NAME#v}" ]]
          archive="WhisperForMac-${GITHUB_REF_NAME}-macOS-universal.zip"
          folder="WhisperForMac-${GITHUB_REF_NAME}"
          staging="$RUNNER_TEMP/$folder"
          mkdir -p "$staging"
          ditto "$app" "$staging/WhisperForMac.app"
          cp distribution/README.txt "$staging/README.txt"
          cp LICENSE.md LOGO-LICENSE.md THIRD-PARTY-NOTICES.md "$staging/"
          codesign --verify --deep --strict "$staging/WhisperForMac.app"
          ditto -c -k --keepParent "$staging" "$archive"
          unzip -tq "$archive"
          unzip -p "$archive" "$folder/README.txt" | cmp - distribution/README.txt
          for notice in LICENSE.md LOGO-LICENSE.md THIRD-PARTY-NOTICES.md; do
            unzip -p "$archive" "$folder/$notice" | cmp - "$notice"
          done
          extracted="$RUNNER_TEMP/release-verification"
          mkdir -p "$extracted"
          ditto -x -k "$archive" "$extracted"
          codesign --verify --deep --strict "$extracted/$folder/WhisperForMac.app"

      - name: Attest release ZIP
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: WhisperForMac-${{ github.ref_name }}-macOS-universal.zip

      - name: Verify release ZIP provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          gh attestation verify "WhisperForMac-${GITHUB_REF_NAME}-macOS-universal.zip" \
            --bundle "$ATTESTATION_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "WhisperForMac-${GITHUB_REF_NAME}-macOS-universal.zip" \
            --verify-tag \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --title "Whisper for Mac ${GITHUB_REF_NAME}"
