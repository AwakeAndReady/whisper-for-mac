name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like v0.1.0" >&2
            exit 1
          fi

      - name: Build Universal app
        shell: bash
        env:
          APP_VERSION: ${{ github.ref_name }}
          BUILD_CONFIGURATION: release
        run: |
          APP_VERSION="${APP_VERSION#v}" ./script/build_and_run.sh build

      - name: Verify and package app
        shell: bash
        run: |
          set -euo pipefail
          app="dist/WhisperForMac.app"
          binary="$app/Contents/MacOS/WhisperForMac"
          codesign --verify --deep --strict --verbose=2 "$app"
          archs="$(lipo -archs "$binary")"
          [[ " $archs " == *' arm64 '* && " $archs " == *' x86_64 '* ]]
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [[ "$version" == "${GITHUB_REF_NAME#v}" ]]
          archive="WhisperForMac-${GITHUB_REF_NAME}-macOS-universal.zip"
          folder="WhisperForMac-${GITHUB_REF_NAME}"
          staging="$RUNNER_TEMP/$folder"
          mkdir -p "$staging"
          ditto "$app" "$staging/WhisperForMac.app"
          cp distribution/README.txt "$staging/README.txt"
          codesign --verify --deep --strict "$staging/WhisperForMac.app"
          ditto -c -k --keepParent "$staging" "$archive"
          unzip -tq "$archive"
          unzip -p "$archive" "$folder/README.txt" | cmp - distribution/README.txt
          extracted="$RUNNER_TEMP/release-verification"
          mkdir -p "$extracted"
          ditto -x -k "$archive" "$extracted"
          codesign --verify --deep --strict "$extracted/$folder/WhisperForMac.app"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "WhisperForMac-${GITHUB_REF_NAME}-macOS-universal.zip" \
            --verify-tag \
            --generate-notes \
            --notes "This app is not signed with an Apple Developer ID or notarized. If macOS blocks the first launch, follow README.txt inside the downloaded ZIP." \
            --title "Whisper for Mac ${GITHUB_REF_NAME}"
